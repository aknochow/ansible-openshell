[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aknochow-openshell"
version = "0.1.0"
description = "Ansible collection for OpenShell integration"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "ansible-core>=2.16.0,<2.20.0",
    "openshell>=0.0.116,<0.0.120",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "ansible-lint>=24.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"plugins/modules/*" = ["E402", "E501"]
"plugins/action/*" = ["E402", "E501"]

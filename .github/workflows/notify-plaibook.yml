name: Notify plaibook pin bump

# ansible-plaibook SHA-pins this collection. A push to main mints a
# plai-crew installation token in the plaibook-crew environment and
# passes only that token to the pinned notify workflow. The private
# key stays in the mint job.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  mint:
    name: Mint plai-crew token
    runs-on: ubuntu-latest
    environment: plaibook-crew
    permissions:
      contents: read
    outputs:
      token: ${{ steps.mint.outputs.token }}
    steps:
      - name: Check out the token mint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          repository: aknochow/ansible-plaibook
          ref: fb40cbe9b7c9d06afc190489bde5f3baf0aacb77
          sparse-checkout: scripts/github_app_token.py
          sparse-checkout-cone-mode: false

      - name: Mint a contents-write installation token
        id: mint
        env:
          PLAI_CREW_APP_ID: ${{ vars.PLAI_CREW_APP_ID }}
          PLAI_CREW_PRIVATE_KEY: ${{ secrets.PLAI_CREW_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          token="$(python3 scripts/github_app_token.py \
            --repo aknochow/ansible-plaibook \
            --id-env PLAI_CREW_APP_ID \
            --key-env PLAI_CREW_PRIVATE_KEY \
            --permission contents=write)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: mint
    permissions: {}
    uses: aknochow/ansible-plaibook/.github/workflows/notify-plaibook-pin-bump.yml@fb40cbe9b7c9d06afc190489bde5f3baf0aacb77
    secrets:
      dispatch_token: ${{ needs.mint.outputs.token }}

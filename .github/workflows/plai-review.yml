name: plaibook review

# Starts after the other pull-request workflows finish. The check run
# branch protection should require is "plaibook review". Re-run with a
# pull-request comment that starts with /plai-review, or workflow_dispatch.
# The reusable workflow receives PLAIBOOK_PROVIDER_TOKEN and is pinned to
# a full commit SHA.

on:
  workflow_run:
    workflows: ["CI", "CodeQL", "OpenSSF Scorecard"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

concurrency:
  group: plaibook-review-${{ github.event.workflow_run.head_sha || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    name: plaibook review
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && !endsWith(github.event.comment.user.login, '[bot]')
        && startsWith(github.event.comment.body, '/plai-review')
      )
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: aknochow/ansible-plaibook/.github/workflows/plai-review-run.yml@a96b3897b29ade4ed790033709be3aca4938a794
    secrets:
      provider_token: ${{ secrets.PLAIBOOK_PROVIDER_TOKEN }}
    with:
      agent_family: ${{ vars.PLAIBOOK_AGENT_FAMILY }}
